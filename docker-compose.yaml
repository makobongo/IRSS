services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intelligent-risk-survey-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Prevent Spring Boot from trying to manage Docker
      # from inside the application container.
      SPRING_DOCKER_COMPOSE_ENABLED: "false"

    volumes:
      # Mount source code for development
      - .:/workspace
      # Keep Maven dependencies outside the container filesystem
      - maven-cache:/root/.m2
    working_dir: /workspace
    command: >
      ./mvnw
      spring-boot:run
      -Dspring-boot.run.profiles=docker
    env_file:
      - .env
    depends_on:
      - mysql
  mysql:
    image: mysql:8.4
    container_name: mysql_irss_db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  maven-cache:
  mysql_data: