services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intelligent-risk-survey-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DEVTOOLS_REMOTE_ENABLED=true
      - SPRING_DEVTOOLS_RESTART_ENABLED=true
    volumes:
      - .:/app
      - maven_cache:/root/.m2
    working_dir: /app
    command: >
      ./mvnw
      spring-boot:run
      -Dspring-boot.run.profiles=docker
    env_file:
      - .env
    depends_on:
      - mysql
  mysql:
    image: mysql:8.4
    container_name: mysql_irss_db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  maven_cache:
  mysql_data: